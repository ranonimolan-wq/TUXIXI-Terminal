name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - name: Install FreeType build dependency
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfreetype6-dev


      - uses: Swatinem/rust-cache@v2

      - name: Run tests (core + CLI)
        run: cargo test

      - name: Build CLI
        run: cargo build --release

      - name: Smoke test
        run: ./target/release/tuxixi --version
