name: Release

# Two ways to publish:
#  * push a v* tag        -> a normal versioned release (asset: same name)
#  * click "Run workflow" -> refreshes the single "rolling" release with
#    a freshly built binary. NO version bump needed: install.sh and
#    `tuxixi update --self` resolve releases/latest/download/..., and the
#    rolling release is created with --latest, so they always pick up
#    the newest build even without a new tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - name: Install FreeType build dependency
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfreetype6-dev


      - uses: Swatinem/rust-cache@v2

      # No system packages needed any more: the GUI is pure Rust
      # (winit + glutin/glow OpenGL + ab_glyph). GTK4/VTE were removed.
      # glutin dlopens libEGL/libGL at runtime, so even the GL stack
      # needs no dev headers at build time.

      - name: Test (core, no GUI feature)
        run: cargo test

      - name: Test (with GUI feature, includes PTY + renderer tests)
        run: cargo test --features gui

      - name: Lint
        run: cargo clippy --features gui --all-targets -- -D warnings

      - name: Build GUI binary
        run: cargo build --release --features gui

      - name: Verify version matches tag (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./target/release/tuxixi --version
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(cargo metadata --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "tag=$TAG crate=$VERSION"
          [ "$TAG" = "v$VERSION" ] || { echo "Cargo.toml version ($VERSION) does not match tag ($TAG)"; exit 1; }

      - name: Package
        run: |
          # Fixed asset name: lets the installer use the stable
          # releases/latest/download/ redirect without any API call.
          mkdir -p dist
          cp target/release/tuxixi tuxixi-512.png dist/
          tar -czf "dist/tuxixi-x86_64-linux.tar.gz" -C dist tuxixi tuxixi-512.png

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tuxixi-x86_64-linux.tar.gz
          generate_release_notes: true

      - name: Refresh rolling release (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace the single rolling release: delete (incl. its tag),
          # recreate at the current commit and mark it as "Latest" so the
          # stable download links and update --self resolve to it.
          gh release delete rolling --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          git push origin :refs/tags/rolling 2>/dev/null || true
          gh release create rolling dist/tuxixi-x86_64-linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "TUXIXI rolling build" \
            --notes "Automatically built from main at ${GITHUB_SHA:0:7}. No version bump - content is identified by SHA-256. install.sh and 'tuxixi update --self' pick this up automatically." \
            --latest
